<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StyleMyHair | Saved Reels</title>

    <!-- FEMALE SAVED REELS CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/saved_reel.css') }}"
    >

</head>


<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="saved-header">

        <!-- BACK TO FEMALE PAGE -->

        <a
    href="javascript:history.back()"
    class="back-button"
    aria-label="Go back"
>
    ←
</a>

        <!-- TITLE -->

        <div class="saved-title">

            <strong>
                Saved Reels
            </strong>

            <span>
                MY SAVED HAIRSTYLES
            </span>

        </div>

    </header>


    <!-- =====================================================
         SAVED FEMALE REELS
    ====================================================== -->

    <main
        class="saved-container"
        id="savedContainer"
    >

        <!--
            Saved female reels will be added here
            automatically by saved_reel.js
        -->

    </main>


    <!-- =====================================================
         EMPTY STATE
    ====================================================== -->

    <div
        class="empty-state"
        id="emptyState"
    >

        <div class="empty-icon">
            🔖
        </div>


        <h2>
            No Reels Saved
        </h2>


        <p>
            Save your favorite hairstyle reels
            and they will appear here.
        </p>


        <!-- GO TO FEMALE REELS -->

        <a
            href="{{ url_for('main.reels') }}"
            class="browse-button"
        >
            Browse Reels
        </a>

    </div>


    <!-- =====================================================
         FEMALE SAVED REELS JAVASCRIPT
    ====================================================== -->

    <script
        src="{{ url_for('static', filename='js/saved_reel.js') }}"
    ></script>


</body>

</html>
